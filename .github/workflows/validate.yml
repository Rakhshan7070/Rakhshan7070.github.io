name: Validate portfolio
on:
  push:
    branches: [main]
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate JSON
        run: python - <<'PY'
          import json
          from pathlib import Path
          for p in Path('data').glob('*.json'):
              json.loads(p.read_text())
              print('OK:', p)
        PY
